[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "copom-tone-index"
version = "0.1.0"
description = "COPOM Watch: indicador textual hawkish/dovish para comunicados e atas do COPOM."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "COPOM Watch" }]
dependencies = [
  "beautifulsoup4>=4.12",
  "duckdb>=1.0",
  "httpx>=0.27",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "plotly>=5.22",
  "pyarrow>=15",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "statsmodels>=0.14",
  "streamlit>=1.35",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
]
llm = [
  "anthropic>=0.34",
]

[project.scripts]
copom-watch = "copom_tone_index.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
